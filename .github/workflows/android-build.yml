name: Build Kabox Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  assemble-debug:
    name: Build Kabox debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v4 no longer requests Google's removed standalone `tools` SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: 'platform-tools'

      - name: Install compile SDK and build tools
        run: |
          sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0'
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify build environment
        run: |
          java --version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kabox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
